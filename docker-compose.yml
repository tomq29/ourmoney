name: ourmoney

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ourmoney
      POSTGRES_USER: ourmoney
      POSTGRES_PASSWORD: ourmoney
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ourmoney -d ourmoney"]
      interval: 2s
      timeout: 3s
      retries: 20

  bot:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ourmoney:ourmoney@db:5432/ourmoney?sslmode=disable
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN:?set it in .env, ask @BotFather for one}"
      ALLOWED_TELEGRAM_IDS: "${ALLOWED_TELEGRAM_IDS:-}"
      CURRENCY: "${CURRENCY:-kzt}"
      LEDGER_NAME: "${LEDGER_NAME:-Наш бюджет}"
      TZ: "${TZ:-Asia/Almaty}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
